name: CI

on:
  push:
    branches: [main]
  pull_request:

# Allow the workflow to publish the documents to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# A run in progress finishes rather than being cancelled, so a deployment is never half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # Pinned rather than `ubuntu-latest`, because the gate compares generated bytes and the image
    # decides which chromium and which system libraries produce them. An image bump would otherwise
    # change a document with no commit of ours.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Restoring this makes the next step do nothing, which is what it does locally once the
      # environment is built. The key is the pinned list, so changing a version rebuilds it.
      - uses: actions/cache@v4
        with:
          path: |
            .ci_env
            ~/.cache/ms-playwright
          key: ci_env-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Only the tool chain which generates the documents. The vignette's own eight packages are
      # deliberately absent: the notebook is committed with its outputs, so converting it needs
      # neither those packages nor the Julia they talk to nor the input data, none of which this
      # runner could provide. What it does check is that the committed outputs are of the committed
      # code, which is `make check`.
      #
      # Built by the `Makefile` rather than by `pip` here, so that the environment which runs the
      # gate is built the same way here and on a developer's machine. The whole tool chain is
      # pinned, not just the converters: one version of `pygments` renders `%%time` as one token and
      # the next renders it as two, and the generated bytes are what `make check` compares.
      #
      # `--with-deps` also installs the system libraries the browser needs, which needs root. That
      # is the one thing this runner does and a developer's machine may not.
      - run: make ci_env PLAYWRIGHT_DEPS=--with-deps

      # Everything is done by the `Makefile`, so that running `make ci` locally does exactly what
      # happens here. Nothing about generating the documents lives in this file.
      - run: make ci

      # The documents are kept whether or not the run succeeded, so that a failure can be examined
      # by downloading what was actually generated instead of trying to reproduce it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documents
          path: docs
          retention-days: 30

      # Recorded on the run page, which is readable without being signed in, unlike the log. This is
      # what to look at first when a run fails.
      - if: always()
        run: |
          echo '## Generated documents' >> $GITHUB_STEP_SUMMARY
          ls -l docs >> $GITHUB_STEP_SUMMARY 2>&1 || echo 'none were generated' >> $GITHUB_STEP_SUMMARY
          echo '## Tool chain' >> $GITHUB_STEP_SUMMARY
          .ci_env/bin/pip freeze >> $GITHUB_STEP_SUMMARY

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: docs

  # Publishing is a job of its own because that is what the deployment environment attaches to. It
  # runs only for `main`, so a pull request is checked without being published.
  publish:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
